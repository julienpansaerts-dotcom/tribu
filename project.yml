name: Tribu
options:
  bundleIdPrefix: com.julienpansaerts
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: fr
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Tribu:
    type: application
    platform: iOS
    sources:
      - path: Tribu
        excludes:
          - "**/Licenses/**"
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseMessaging
    entitlements:
      path: Tribu/Tribu.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        aps-environment: development
    info:
      path: Tribu/Info.plist
      properties:
        CFBundleDisplayName: Tribu
        CFBundleDevelopmentRegion: fr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - TribuBricolage-Regular.ttf
          - TribuBricolage-SemiBold.ttf
          - TribuBricolage-ExtraBold.ttf
          - TribuCaveat-Bold.ttf
          - TribuNewsreader-Regular.ttf
          - TribuNewsreader-Medium.ttf
          - TribuNewsreaderItalic-Medium.ttf
          - TribuHanken-Regular.ttf
          - TribuHanken-Medium.ttf
          - TribuHanken-SemiBold.ttf
          - TribuHanken-Bold.ttf
          - TribuFamiljen-Regular.ttf
          - TribuFamiljen-SemiBold.ttf
          - TribuFamiljen-Bold.ttf
        NSPhotoLibraryUsageDescription: Tribu utilise vos photos pour la photo de famille, les recettes et les factures.
        NSCameraUsageDescription: Tribu utilise l'appareil photo pour scanner les factures et les tickets.
        NSCalendarsFullAccessUsageDescription: Tribu copie l'agenda de la famille dans un calendrier « Tribu » de ton iPhone.
        NSCalendarsWriteOnlyAccessUsageDescription: Tribu copie l'agenda de la famille dans un calendrier « Tribu » de ton iPhone.
        NSFaceIDUsageDescription: Tribu protège les informations de santé et les papiers avec Face ID.
        UIBackgroundModes:
          - remote-notification
        FirebaseAppDelegateProxyEnabled: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tribu
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        OTHER_LDFLAGS: $(inherited) -ObjC
schemes:
  Tribu:
    build:
      targets:
        Tribu: all
    run:
      config: Debug
    archive:
      config: Release
