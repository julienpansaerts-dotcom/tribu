name: TestFlight

# Lancement manuel : onglet Actions → TestFlight → Run workflow.
# Secrets nécessaires (Settings → Secrets and variables → Actions) :
#   APPLE_TEAM_ID          identifiant d'équipe Apple (10 caractères)
#   ASC_KEY_ID             identifiant de la clé API App Store Connect
#   ASC_ISSUER_ID          identifiant de l'émetteur (Issuer ID)
#   ASC_KEY_P8             contenu complet du fichier AuthKey_XXXX.p8
on:
  workflow_dispatch:

jobs:
  upload:
    name: Envoi sur TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Choisir Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Vérifier les secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=0
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::Secret manquant : $v"; missing=1; fi
          done
          exit $missing

      - name: Ajouter la configuration Firebase
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            printf '%s\n' "$GOOGLE_SERVICE_INFO_PLIST" > Tribu/Resources/GoogleService-Info.plist
            plutil -lint Tribu/Resources/GoogleService-Info.plist
          else
            echo "::error::Secret GOOGLE_SERVICE_INFO_PLIST manquant"; exit 1
          fi

      - name: Installer XcodeGen et générer le projet
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Préparer la clé API
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      # L'archive n'est pas signée : la signature se fait à l'export avec le certificat de
      # distribution géré par Apple (cloud), ce qui évite de créer un certificat de développement
      # à chaque exécution (Apple limite leur nombre).
      - name: Archiver
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -project Tribu.xcodeproj -scheme Tribu -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Tribu.xcarchive \
            -skipPackagePluginValidation -skipMacroValidation \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee archive.log | grep -E "error:|ARCHIVE" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log || { grep -E "error:" archive.log | sort -u | head -60; exit 1; }

      - name: Exporter l'app signée (.ipa)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Tribu.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la build/export

      - name: Envoyer sur App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$KEY_PATH" ~/.appstoreconnect/private_keys/
          xcrun altool --upload-app --type ios \
            --file build/export/Tribu.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            --output-format normal 2>&1 | tee upload.log
          if grep -q "ERROR" upload.log; then
            echo "::error::L'envoi a été refusé par App Store Connect (voir ci-dessus)."
            exit 1
          fi

      - name: Journal en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: journal-archive
          path: archive.log
          if-no-files-found: ignore
