name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilation et captures d'écran
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Choisir Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Versions
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Ajouter la configuration Firebase
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            printf '%s\n' "$GOOGLE_SERVICE_INFO_PLIST" > Tribu/Resources/GoogleService-Info.plist
            plutil -lint Tribu/Resources/GoogleService-Info.plist
          else
            echo "::warning::Secret GOOGLE_SERVICE_INFO_PLIST absent : l'app tournera en mode démo."
          fi

      - name: Cache des paquets Swift
        uses: actions/cache@v4
        with:
          path: spm
          key: spm-${{ hashFiles('project.yml') }}

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Compiler pour le simulateur
        run: |
          set -o pipefail
          xcodebuild -project Tribu.xcodeproj -scheme Tribu -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath spm \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD" || true
          if ! grep -q "BUILD SUCCEEDED" build.log; then
            echo "::group::Erreurs"; grep -E "error:" build.log | sort -u | head -80; echo "::endgroup::"
            exit 1
          fi

      - name: Captures d'écran dans le simulateur
        run: scripts/screenshots.sh build/Build/Products/Debug-iphonesimulator/Tribu.app screenshots

      - name: Publier les captures sur la branche « captures »
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd screenshots
          {
            echo "# Captures d'écran — ${GITHUB_SHA::7}"
            echo
            for f in *.png; do echo "### ${f%.png}"; echo; echo "<img src=\"$f\" width=\"300\">"; echo; done
          } > README.md
          git init -q -b captures
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Captures pour ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" captures

      - name: Publier les captures
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: captures-ecran
          path: screenshots/
          if-no-files-found: ignore

      - name: Publier le journal de compilation
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: journal-compilation
          path: build.log
          if-no-files-found: ignore
