name: Firebase

# Met en place les règles de sécurité de la base Firestore et du stockage.
on:
  push:
    branches: [main]
    paths:
      - "firebase/**"
      - "firebase.json"
      - ".github/workflows/firebase.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Déployer les règles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Préparer le compte de service
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "::error::Secret FIREBASE_SERVICE_ACCOUNT manquant"; exit 1; fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          echo "FIREBASE_PROJECT=$(jq -r .project_id "$RUNNER_TEMP/sa.json")" >> "$GITHUB_ENV"

      - name: Déployer
        run: npx --yes firebase-tools@14 deploy --only firestore:rules,storage --project "$FIREBASE_PROJECT" --non-interactive
